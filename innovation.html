<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Innovation Hub | IUEA EQUAL</title><meta name="description" content="Student software, engineering and leadership projects from IUEA."><link rel="stylesheet" href="style.css"></head><body>
<section class="page-hero"><div class="wrap"><h1>Innovation Hub</h1><p class="lead">Real applications, tools and initiatives built by IUEA students.</p></div></section>
<section><div class="wrap"><div class="filters" id="hubFilters"></div><div class="grid" id="hubList"></div></div></section>
<section id="submit"><div class="wrap"><h2>Submit your project</h2><p>Fill this in and press Send in the email that opens. We will review it and add it to the hub.</p>
<form class="card" id="projectForm"><input name="Name" placeholder="Your name" required maxlength="80">
<select name="Faculty"><option>Engineering & Tech</option><option>Business & Management</option><option>Law & Governance</option><option>Other</option></select>
<input name="Project title" placeholder="Project title" required maxlength="100"><input name="Link" placeholder="Link to your project (optional)" maxlength="200">
<textarea name="Description" rows="4" placeholder="What does it do and who does it help?" required maxlength="800"></textarea>
<button class="btn" type="submit">Submit project</button><p id="projectFormMsg" hidden>Your email app should open. Press Send to finish.</p></form></div></section>
<script src="app.js"></script></body></html>
